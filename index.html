<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card Benefits and Spend Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <p class="brand-mark">Credit Card Benefits and Spend Tracking</p>
        <p class="brand-sub">Track unused perks. Hit every spend goal.</p>
        <span id="sync-status" class="sync-badge sync-off">Offline demo</span>
      </div>

      <nav class="view-tabs" role="tablist">
        <button type="button" class="tab is-active" data-view="overview" role="tab">Overview</button>
        <button type="button" class="tab" data-view="benefits" role="tab">Benefits</button>
        <button type="button" class="tab" data-view="spends" role="tab">Spend goals</button>
      </nav>

      <div class="top-actions">
        <button type="button" class="btn primary" id="btn-add">+ Add</button>
        <button type="button" class="btn ghost" id="btn-refresh" title="Reload from Sheet">↻</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>
  </header>

  <main class="shell">
    <section class="controls">
      <input type="search" id="search" placeholder="Search…" />
      <select id="filter-person"><option value="">All people</option></select>
      <select id="filter-card"><option value="">All cards</option></select>
      <select id="filter-status">
        <option value="">All statuses</option>
      </select>
      <select id="sort-by"></select>
    </section>

    <section class="board" id="board" aria-live="polite"></section>
    <p class="empty" id="empty" hidden>Nothing here yet. Click <strong>+ Add</strong> to create one.</p>
  </main>

  <dialog id="editor" class="editor">
    <form method="dialog" id="editor-form">
      <header class="editor-head">
        <h2 id="editor-title">Add item</h2>
        <button type="button" class="icon-close" id="editor-close" aria-label="Close">×</button>
      </header>
      <div class="editor-body" id="editor-fields"></div>
      <footer class="editor-foot">
        <button type="button" class="btn danger" id="editor-delete" hidden>Delete</button>
        <div class="spacer"></div>
        <button type="button" class="btn ghost" id="editor-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="editor-save">Save</button>
      </footer>
    </form>
  </dialog>

  <footer class="foot">
    <p>Data lives in your Google Sheet. Change the site passcode in the <strong>Config</strong> tab anytime.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
